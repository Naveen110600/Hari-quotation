<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SRI TRADERS</title>
    <link rel="icon" href="{{ url_for('static', filename='icon.jpeg') }}" type="image/jpeg">
    <style>
        body {
            background: #ccc;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin-top: 60px;
            font-family: Arial, sans-serif;
        }

        #a4 {
            position: relative;
            /* required */
            background: white;
            padding: 15mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Portrait */
        .a4-portrait {
            width: 210mm;
            height: calc(297mm - 0.5mm);
        }

        /* Landscape */
        .a4-landscape {
            width: 297mm;
            height: 210mm;
        }


        /* ===== MAIN LAYOUT TABLE ===== */
        .invoice-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .invoice-table td {
            padding: 0;
            border: none;
            vertical-align: top;
        }

        .invoice-table tr:first-child {
            height: auto;
        }

        .invoice-table tr:last-child {
            height: 100%;
        }


        /* ===== TOP TABLE ===== */
        .top-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .top-table td {
            border: 1px solid black;
            padding: 3px 5px;
            vertical-align: top;
            font-size: 11px;
            min-height: 40px;
        }

        /* 50% left / 50% right */
        .top-table col {
            width: 25%;
        }

        /* ===== BODY TABLE ===== */
        .body-table {
            width: 100%;
            height: 100%;
            border: 1px solid black;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 11px;
        }

        /* Vertical borders only */
        .body-table th,
        .body-table td {
            border-left: 1px solid black;
            border-right: 1px solid black;
        }


        /* Header bottom border */
        .body-table thead th {
            border-bottom: 1px solid black;
            font-size: 11px;
            padding: 3px 0px;
        }

        /* Remove internal horizontal lines */
        .body-table tbody td {
            font-size: 10px;
            border-top: none;
            border-bottom: none;
            padding: 5px 3px;
            /* spacing between rows */
        }

        /* Footer top border */
        .body-table tfoot td {
            font-size: 10px;
            border-top: 1px solid black;
            padding: 3px;
        }

        /* Editable cells */
        [contenteditable="true"] {
            outline: none;
        }

        @media print {
            body {
                background: none;
                margin: 0;
            }

            #a4 {
                margin: 0;
            }

            button {
                display: none !important;
            }

            .active-cell,
            .pdf-mode .active-cell {
                outline: none !important;
                background: #fff !important;
                background-color: #fff !important;
            }

            .invoice-table tr,
            .invoice-table td,
            .body-table tr,
            .body-table td,
            #invoice-body tr,
            #invoice-body td,
            .selected-row,
            .selected-row td {
                background: #fff !important;
                background-color: #fff !important;
            }
        }

        .pdf-mode .active-cell {
            outline: none !important;
            background: #fff !important;
            background-color: #fff !important;
        }

        .pdf-mode .invoice-table tr,
        .pdf-mode .invoice-table td,
        .pdf-mode .body-table tr,
        .pdf-mode .body-table td,
        .pdf-mode #invoice-body tr,
        .pdf-mode #invoice-body td,
        .pdf-mode .selected-row,
        .pdf-mode .selected-row td {
            background: #fff !important;
            background-color: #fff !important;
        }

        #editor-toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #f4f4f4;
            padding: 8px;
            display: flex;
            gap: 5px;
            z-index: 1000;
            border-bottom: 1px solid #ccc;
        }

        .selected-row td {
            background-color: #e5fcff;
        }

        .active-cell {
            outline: 2px solid #009c05;
            outline-offset: -2px;
        }

        .calc-cell {
            white-space: normal !important;
            word-break: break-word;
            overflow-wrap: break-word;
        }


        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 750px;
            height: 750px;

            background: url("{{ url_for('static', filename='icon.jpeg') }}") no-repeat center;
            background-size: contain;

            transform: translate(-50%, -50%);
            /* 🔒 physical center lock */
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }






        .primary-btn {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .primary-btn:hover {
            background: #0056b3;
        }


        .sidebar {
            background: #f4f4f4;
            border-right: 1px solid #ccc;
            height: calc(297mm - 0.5mm);
            overflow-y: auto;
            overflow-x: scroll;
            max-width: 100mm;
            padding: 0px 10px;
        }

        .editor {
            flex: 1;
            overflow: auto;
            padding-left: 10px;
        }

        .invoice-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
        }

        .invoice-id {
            flex: 1;
            /* occupies remaining width */
            cursor: pointer;
        }

        .right-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            cursor: pointer;
        }

        .invoice-item:hover {
            background: #e8e8e8;
        }

        .date-header {
            font-size: 12px;
            font-weight: bold;
            color: #666;
            margin-top: 10px;
            margin-bottom: 4px;
            text-align: center;
        }
    </style>
</head>

        function calculateGst() {

            const rows = document.querySelectorAll("#invoice-body tr");
            const gstMap = {};

            // 1️⃣ Collect & group by GST % + HSN
            rows.forEach(row => {

                const amountCell = row.querySelector('[data-field="amount"]');
                const gstCell = row.querySelector('[data-field="gst"]');
                const hsnCell = row.querySelector('[data-field="hsn_code"]'); // ✅ FIXED

                if (!amountCell || !gstCell) return;

                const amount = parseFloat(amountCell.innerText) || 0;
                const gstPercent = parseFloat(gstCell.innerText) || 0;
                const hsn = hsnCell ? hsnCell.innerText.trim() : "";

                if (gstPercent <= 0) return;

                if (!gstMap[gstPercent]) {
                    gstMap[gstPercent] = {
                        taxable: 0,
                        hsnSet: new Set()
                    };
                }

                gstMap[gstPercent].taxable += amount;

                if (hsn !== "") {
                    gstMap[gstPercent].hsnSet.add(hsn);
                }

            });

            const tfoot = document.querySelector("tfoot");
            const totalRow = document.getElementById("gst-total-row");

            // 2️⃣ Remove old dynamic rows
            tfoot.querySelectorAll(".dynamic-gst-row").forEach(row => row.remove());

            let totalTaxable = 0;
            let totalSgst = 0;
            let totalCgst = 0;
            let totalTax = 0;

            // 3️⃣ Insert GST rows before total row
            Object.keys(gstMap).forEach(gstPercent => {

                const taxable = gstMap[gstPercent].taxable;
                const hsnCodes = Array.from(gstMap[gstPercent].hsnSet).join(", ");

                const gstAmount = taxable * gstPercent / 100;
                const sgst = gstAmount / 2;
                const cgst = gstAmount / 2;

                totalTaxable += taxable;
                totalSgst += sgst;
                totalCgst += cgst;
                totalTax += gstAmount;

                const row = document.createElement("tr");
                row.classList.add("dynamic-gst-row");

                row.innerHTML = `
            <td colspan="2" style="text-align:right;">${hsnCodes}</td>
            <td colspan="3" style="text-align:right;">${taxable.toFixed(2)}</td>

            <td colspan="2" style="text-align:right;">${(gstPercent / 2).toFixed(2)}%</td>
            <td colspan="2" style="text-align:right;">${sgst.toFixed(2)}</td>

            <td colspan="2" style="text-align:right;">${(gstPercent / 2).toFixed(2)}%</td>
            <td colspan="2" style="text-align:right;">${cgst.toFixed(2)}</td>

            <td colspan="3" style="text-align:right;">${gstAmount.toFixed(2)}</td>
        `;

                tfoot.insertBefore(row, totalRow);

            });

            // 4️⃣ Update total row
            const cells = totalRow.querySelectorAll("td");

            cells[1].innerText = totalTaxable.toFixed(2);
            cells[3].innerText = totalSgst.toFixed(2);
            cells[5].innerText = totalCgst.toFixed(2);
            cells[6].innerText = totalTax.toFixed(2);
        }

        function calculateGrandTotal() {

            let totals = {
                quantity: 0,
                amount: 0
            };

            document.querySelectorAll("#invoice-body tr").forEach(row => {

                if (row.id === "filler-row") return;

                for (let key in totals) {

                    const cell = row.querySelector(`[data-field="${key}"]`);
                    if (!cell) continue;

                    totals[key] += parseFloat(cell.innerText) || 0;
                }
            });

            // 🔹 Get GST totals from footer (already calculated in calculateGst)
            const totalRow = document.getElementById("gst-total-row");
            const gstCells = totalRow ? totalRow.querySelectorAll("td") : [];

            const totalSgst = gstCells[3] ? parseFloat(gstCells[3].innerText) || 0 : 0;
            const totalCgst = gstCells[5] ? parseFloat(gstCells[5].innerText) || 0 : 0;

            const totalTax = totalSgst + totalCgst;

            // 🔹 Calculate final total
            const grossTotal = totals.amount + totalTax;

            // 🔹 Round Off Logic
            const roundedTotal = Math.round(grossTotal);
            const roundOff = roundedTotal - grossTotal;

            // 🔹 Display Grand Quantity
            document.getElementById("grand-quantity").innerText =
                totals.quantity;

            // 🔹 Display Final Rounded Grand Amount
            document.getElementById("grand-amount").innerText =
                "₹ " + roundedTotal.toLocaleString("en-IN", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

            // 🔹 Display breakup inside filler-row
            document.getElementById("grand-total-words").innerText =
                numberToWordsIndian(roundedTotal);

            // 🔹 Display breakup inside filler-row
            const fillerRow = document.getElementById("total_calc");

            // Adjust index based on your structure
            fillerRow.innerHTML = `<hr style="margin-top:0px; border: none; height: 1px; background-color: #000;">

            ${totalCgst.toFixed(2)} <br>
            ${roundOff.toFixed(2)}
        </div>
    `;
        }

        function numberToWordsIndian(num) {

            const ones = [
                "", "One", "Two", "Three", "Four", "Five", "Six",
                "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve",
                "Thirteen", "Fourteen", "Fifteen", "Sixteen",
                "Seventeen", "Eighteen", "Nineteen"
            ];

            const tens = [
                "", "", "Twenty", "Thirty", "Forty",
                "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"
            ];

            function convertBelowThousand(n) {
                let str = "";

                if (n >= 100) {
                    str += ones[Math.floor(n / 100)] + " Hundred ";
                    n = n % 100;
                }

                if (n >= 20) {
                    str += tens[Math.floor(n / 10)] + " ";
                    n = n % 10;
                }

                if (n > 0) {
                    str += ones[n] + " ";
                }

                return str.trim();
            }

            if (num === 0) return "Indian Rupees Zero Only.";

            let result = "";

            const crore = Math.floor(num / 10000000);
            num %= 10000000;

            const lakh = Math.floor(num / 100000);
            num %= 100000;

            const thousand = Math.floor(num / 1000);
            num %= 1000;

            const remainder = num;

            if (crore) result += convertBelowThousand(crore) + " Crore ";
            if (lakh) result += convertBelowThousand(lakh) + " Lakh ";
            if (thousand) result += convertBelowThousand(thousand) + " Thousand ";
            if (remainder) result += convertBelowThousand(remainder);

            return "Indian Rupees " + result.trim() + " Only.";
        }

        function setFontSize(size) {

            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;

            const range = selection.getRangeAt(0);

            const span = document.createElement("span");
            span.style.fontSize = size;

            span.appendChild(range.extractContents());
            range.insertNode(span);

            selection.removeAllRanges();

        function formatInvoiceCells(excludeCell = null) {

            document.querySelectorAll("#invoice-body td[contenteditable='true']").forEach(cell => {

                if (excludeCell && cell === excludeCell) return;

                const field = cell.dataset.field;
                if (!field) return;

                let raw = cell.innerText.trim();
                if (!raw) return;

                /* ---------- GST ---------- */
                if (field === "gst") {
                    let gst = parseFloat(raw.replace(/[^\d.]/g, "")) || 0;
                    cell.innerText = gst + "%";
                    return;
                }

                /* ---------- NUMERIC ---------- */
                if (field === "rate") {
                    // 🔹 Rate: only .00, NO commas
                    let num = parseFloat(raw.replace(/[^\d.]/g, "")) || 0;
                    cell.innerText = num.toFixed(2);
                    return;
                }
            });
        }

        async function generatePDFBlob() {

            const element = document.getElementById("a4");

            // Remove UI-only highlight classes before html2canvas renders the invoice
            // (html2canvas captures the live DOM visually; @media print does not apply)
            const selectedRows = element.querySelectorAll(".selected-row");
            const activeCells = element.querySelectorAll(".active-cell");
            selectedRows.forEach(r => r.classList.remove("selected-row"));
            activeCells.forEach(c => {
                c.classList.remove("active-cell");
                c.style.outline = "none";
            });

            const opt = {
                margin: 0,
                filename: "Tax-Invoice.pdf",
                image: { type: "jpeg", quality: 1 },
                html2canvas: { scale: 2, scrollY: 0 },
                jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
            };

            try {

                const blob = await html2pdf().set(opt).from(element).outputPdf("blob");
                return blob;

            } catch (err) {

                console.error("PDF generation failed:", err);
                alert("PDF generation failed");
                return null;

            } finally {
                // Restore UI classes so the interactive screen is unchanged
                selectedRows.forEach(r => r.classList.add("selected-row"));
                activeCells.forEach(c => {
                    c.classList.add("active-cell");
                    c.style.outline = "";
                });
            }
        }

                method: "POST",

            const pdfBlob = await response.blob();
            const url = URL.createObjectURL(pdfBlob);

            const iframe = document.createElement("iframe");

            iframe.style.position = "fixed";
            iframe.style.right = "0";
            iframe.style.bottom = "0";
            iframe.style.width = "0";
            iframe.style.height = "0";
            iframe.style.border = "0";

            iframe.src = url;

            document.body.appendChild(iframe);

            iframe.onload = function () {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            };

        }

        function saveData() {

            const original = document.getElementById("a4");
            const clone = original.cloneNode(true);

            // Remove selected row highlight
            clone.querySelectorAll(".selected-row").forEach(row => {
                row.classList.remove("selected-row");
            });

            // Remove active cell border
            clone.querySelectorAll(".active-cell").forEach(cell => {
                cell.classList.remove("active-cell");
            });

            const cleanedHTML = clone.outerHTML;

            /* ---------- ASK NAME ONLY FOR NEW INVOICE ---------- */

            if (!currentInvoiceId) {

                const name = prompt("Enter Invoice Name / Number");

                if (!name) return;

                fetch("/save", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        data: cleanedHTML
                    })
                })
                    .then(res => res.json())
                    .then(result => {

                        currentInvoiceId = result.invoice_id;
                        currentFileName = name;

                        alert("Invoice saved");

                        loadInvoiceList();

                    });

            }

            /* ---------- UPDATE EXISTING INVOICE ---------- */

            else {

                fetch("/update-invoice", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id: currentInvoiceId,
                        name: currentFileName,
                        data: cleanedHTML
                    })
                })
                    .then(res => res.json())
                    .then(result => {
                        alert("Invoice updated");
                        loadInvoiceList();
                    });

            }

        }

            container.innerHTML = "";

            let currentGroup = "";

            invoices
                .sort((a, b) => b.id - a.id)   // newest first
                .forEach(inv => {

                    const label = getDateLabel(inv.id);

                    if (label !== currentGroup) {

                        const header = document.createElement("div");
                        header.className = "date-header";
                        header.textContent = label;

                        container.appendChild(header);

                        currentGroup = label;

                    }

                    const row = document.createElement("div");

                    row.className = "invoice-item";

                    row.innerHTML = `

${inv.name}

        async function renameInvoice(oldId) {

            const newId = prompt("Enter new invoice name", oldId);

            if (!newId) return;

            await fetch("/rename-invoice", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    old_id: oldId,
                    new_id: newId
                })
            });

            loadInvoiceList();

        }

        async function deleteInvoice(id) {

            if (!confirm("Delete invoice " + id + " ?")) return;

            await fetch("/delete-invoice", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ id: id })
            });

            loadInvoiceList();

        }


        function getDateLabel(timestamp) {

            const date = new Date(parseInt(timestamp));

            const today = new Date();
            const yesterday = new Date();

            yesterday.setDate(today.getDate() - 1);

            if (date.toDateString() === today.toDateString()) {
                return "Today";
            }

            if (date.toDateString() === yesterday.toDateString()) {
                return "Yesterday";
            }

            return date.toLocaleDateString();
        }

        function searchInvoices() {

            const q = document
                .getElementById("invoiceSearch")
                .value
                .toLowerCase()
                .trim();

            document.querySelectorAll("#invoice-list .invoice-item")
                .forEach(row => {

                    const name = row
                        .querySelector(".invoice-id")
                        .textContent
                        .toLowerCase();

                    row.style.display = name.includes(q) ? "flex" : "none";

                });

        }
